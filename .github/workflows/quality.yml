name: Quality

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check pull request branch policy
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: printf 'refs/heads/pull-request HEAD refs/heads/pull-request 0000000000000000000000000000000000000000\n' | MINDBRIDGE_DEVELOP_REF="$BASE_SHA" ./scripts/branch-policy.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[dev]'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run all checks
        run: npm run check:push
