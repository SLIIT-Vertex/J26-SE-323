[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mindbridge-backend"
version = "0.1.0"
description = "Shared API foundation for MindBridge"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "ortools>=9.10,<10",
  "pillow>=10.4,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdfium2>=4.30,<6",
  "python-multipart>=0.0.12",
  "qrcode>=7.4,<9",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "torch>=2.4,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
curriculum-extraction = [
  "pymupdf>=1.26,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
gemini = [
  "google-genai>=2.28,<3",
]
skill-mapper = [
  "sentence-transformers>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
