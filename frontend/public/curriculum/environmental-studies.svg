    <path d="M438 905c43-16 84-16 126 0 42 16 83 16 125 0" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M514 172c8 31 19 42 49 50-30 8-41 20-49 51-8-31-19-43-49-51 30-8 41-19 49-50Z"/>
    <path d="M846 309c7 28 17 38 44 45-27 7-37 18-44 46-7-28-18-39-45-46 27-7 38-17 45-45Z"/>
    <path d="M833 603c6 25 15 34 39 40-24 6-33 16-39 41-6-25-15-35-39-41 24-6 33-15 39-40Z"/>
    <circle cx="185" cy="737" r="10"/>
    <circle cx="546" cy="361" r="9"/>
  </g>

  <!-- crisp white badge rim -->
  <circle cx="512" cy="512" r="476" fill="none" stroke="#FFFFFF" stroke-width="22"/>
</svg>
