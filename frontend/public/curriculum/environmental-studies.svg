    <g fill="url(#landFill)" stroke="#159E25" stroke-width="9" stroke-linejoin="round">
      <path d="M245 505c34-38 83-60 133-56l26 30-13 38-39 20-4 39-47 26-52-17-38-43Z"/>
      <path d="M409 576l52-34 58 21 18 47-38 30-7 55-34 17-31-42-44-13-12-44Z"/>
      <path d="M249 657l49 11 29 43 44 24-17 80-39 28-54-31-38-67 4-55Z"/>
    </g>
    <path d="M231 565c32-61 92-94 155-99" fill="none" stroke="#C9F5FF" stroke-width="17" stroke-linecap="round" opacity=".8"/>
    <path d="M196 649c73 26 265 26 336 0M364 450c-58 45-85 112-85 199s27 154 85 200M364 450c58 45 85 112 85 199s-27 154-85 200" fill="none" stroke="#BCEFFF" stroke-width="10" opacity=".66"/>
  </g>

  <!-- growing plant and pot -->
  <g filter="url(#shadow)">
    <path d="M681 699V504" fill="none" stroke="#119920" stroke-width="27" stroke-linecap="round"/>
    <path d="M679 584c-87-5-135-48-146-127 80-2 135 38 146 127Z" fill="url(#stemFill)" stroke="#109A1E" stroke-width="14" stroke-linejoin="round"/>
    <path d="M687 529c75-5 121-44 134-111-73-2-123 34-134 111Z" fill="url(#leafFill)" stroke="#109A1E" stroke-width="14" stroke-linejoin="round"/>
    <path d="M558 478c28 4 57 22 82 51M713 500c25-22 50-41 77-57" fill="none" stroke="#CFFF92" stroke-width="13" stroke-linecap="round" opacity=".9"/>
    <path d="M584 681h194l-24 176c-3 23-22 40-45 40h-57c-23 0-42-17-45-40Z" fill="url(#potFill)" stroke="#E9500B" stroke-width="16" stroke-linejoin="round"/>
    <path d="M567 658h228c14 0 25 11 25 25v14c0 14-11 25-25 25H567c-14 0-25-11-25-25v-14c0-14 11-25 25-25Z" fill="#FF9D18" stroke="#E9500B" stroke-width="16"/>
    <path d="M593 674h177" fill="none" stroke="#FFD76B" stroke-width="13" stroke-linecap="round"/>
    <path d="M625 746l13 96" fill="none" stroke="#FFC14A" stroke-width="12" stroke-linecap="round" opacity=".72"/>
  </g>

  <!-- small water and wildlife detail -->
  <g filter="url(#shadow)">
    <path d="M442 861c47-28 93-28 140 0-47 28-93 28-140 0Zm140 0 41-27v54Z" fill="#FFE04A" stroke="#F39900" stroke-width="11" stroke-linejoin="round"/>
