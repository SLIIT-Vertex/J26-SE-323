<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Environmental studies badge">
  <defs>
    <radialGradient id="badgeBg" cx="68%" cy="24%" r="92%">
      <stop offset="0" stop-color="#DDF4FF"/>
      <stop offset=".54" stop-color="#A8DAFA"/>
      <stop offset="1" stop-color="#7CC5F3"/>
    </radialGradient>
    <linearGradient id="sunFill" x1="266" y1="163" x2="403" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF45A"/>
      <stop offset=".55" stop-color="#FFC51B"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="594" y1="188" x2="791" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BF33C"/>
      <stop offset=".52" stop-color="#45D51F"/>
      <stop offset="1" stop-color="#12A91C"/>
    </linearGradient>
    <radialGradient id="oceanFill" cx="37%" cy="26%" r="79%">
      <stop offset="0" stop-color="#54DFFF"/>
      <stop offset=".62" stop-color="#149FE7"/>
      <stop offset="1" stop-color="#0870C7"/>
    </radialGradient>
    <linearGradient id="landFill" x1="232" y1="489" x2="503" y2="805" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A1F03F"/>
      <stop offset="1" stop-color="#2EBF25"/>
    </linearGradient>
    <linearGradient id="potFill" x1="616" y1="623" x2="765" y2="863" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB12C"/>
      <stop offset="1" stop-color="#F05A12"/>
    </linearGradient>
    <linearGradient id="stemFill" x1="659" y1="490" x2="702" y2="726" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72E933"/>
      <stop offset="1" stop-color="#18A928"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#17659A" flood-opacity=".28"/>
    </filter>
    <clipPath id="badgeClip">
      <circle cx="512" cy="512" r="457"/>
    </clipPath>
  </defs>

  <!-- glossy round badge -->
  <circle cx="512" cy="512" r="476" fill="url(#badgeBg)" stroke="#FFFFFF" stroke-width="22"/>
  <circle cx="512" cy="512" r="451" fill="none" stroke="#69BDF1" stroke-width="9"/>
  <g clip-path="url(#badgeClip)">
    <path d="M112 248c119-133 340-196 563-126 104 33 170 96 181 167 12 80-55 148-156 133-121-18-174-119-301-90-91 21-136 107-226 111-75 3-112-73-61-195Z" fill="#FFFFFF" opacity=".16"/>
    <path d="M105 561c52-76 124-101 205-65 67 30 106 91 178 91 87 0 115-87 209-91 74-3 140 49 189 140v244H110Z" fill="#FFFFFF" opacity=".11"/>
  </g>

  <!-- sun -->
  <g filter="url(#shadow)" stroke-linecap="round">
    <g fill="none" stroke="#FF8A00" stroke-width="20">
      <path d="M337 129v42"/>
      <path d="M234 174l27 33"/>
      <path d="M440 174l-27 33"/>
      <path d="M190 276h43"/>
      <path d="M441 276h43"/>
      <path d="M232 376l30-31"/>
      <path d="M442 376l-30-31"/>
    </g>
    <circle cx="337" cy="276" r="91" fill="url(#sunFill)" stroke="#FF8A00" stroke-width="13"/>
    <path d="M281 242c17-35 52-54 88-49" fill="none" stroke="#FFF8A9" stroke-width="14" opacity=".9"/>
  </g>

  <!-- glossy leaf -->
