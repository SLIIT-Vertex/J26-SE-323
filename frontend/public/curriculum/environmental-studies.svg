    <path d="M621 382c49-48 94-94 140-146" fill="none" stroke="#D9FF9D" stroke-width="15" stroke-linecap="round"/>
    <path d="M675 328l-7-67M708 296l61 3" fill="none" stroke="#76E83D" stroke-width="11" stroke-linecap="round"/>
    <path d="M651 248c29-24 61-34 96-34" fill="none" stroke="#C9FF8B" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- globe -->
  <g filter="url(#shadow)">
